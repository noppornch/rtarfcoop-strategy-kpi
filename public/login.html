<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบบริหารจัดการและติดตามแผนกลยุทธ์</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i data-lucide="target" style="width: 32px; height: 32px; stroke-width: 2.5;"></i>
        <span>RTARFCOOP</span>
      </div>
      <div class="login-subtitle">ระบบติดตามแผนกลยุทธ์และโครงการ</div>
    </div>

    <div id="login-error" class="login-error">
      ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username" class="form-label">ชื่อผู้ใช้งาน (Username)</label>
        <div style="position: relative;">
          <i data-lucide="user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
          <input type="text" id="username" class="form-control" style="padding-left: 40px;" placeholder="กรอกชื่อผู้ใช้งาน" required autocomplete="username">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: var(--space-lg);">
        <label for="password" class="form-label">รหัสผ่าน (Password)</label>
        <div style="position: relative;">
          <i data-lucide="lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
          <input type="password" id="password" class="form-control" style="padding-left: 40px;" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
        <span>เข้าสู่ระบบ</span>
        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
      </button>
    </form>

  </div>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    // Login Form logic
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.querySelector('span').innerText = 'กำลังเข้าสู่ระบบ...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();
        
        if (response.ok && result.success) {
          window.location.href = '/';
        } else {
          errorBox.innerText = result.error || 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.querySelector('span').innerText = 'เข้าสู่ระบบ';
        }
      } catch (err) {
        errorBox.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.querySelector('span').innerText = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
